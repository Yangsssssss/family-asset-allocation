name: 家庭资产配置（IPS 投资政策书）
slug: family-asset-allocation
version: 1.1.0
display_name: 家庭资产配置（IPS 投资政策书）
display_name_en: Family Asset Allocation (IPS)
author: "yangsssssss"
category: 金融投资 · 家庭理财
description: >-
  把家庭可投资金按用途分桶，产出带比例上下限、再平衡触发条件与目标达成概率的 IPS 投资政策书。
  七模块：家庭财务体检→风险画像→目标与时间分桶→战略配置SAA→选品映射→再平衡规则→保障缺口。
  缺失信息用缺省假设填充并在首页列出，不反复追问。纯 Python 标准库实现，零依赖。
description_zh: >-
  把家庭可投资金按用途分桶，产出带比例上下限、再平衡触发条件与目标达成概率的 IPS 投资政策书。
  七模块：家庭财务体检→风险画像→目标与时间分桶→战略配置SAA→选品映射→再平衡规则→保障缺口。
  含蒙特卡洛达成率测算与保险缺口测算；比例上限之间互相牵制，会先做可行性校验再给方案
  （权益/外币/本币三条约束推导），并给出币种错配敏感性与跨境资产建仓阶梯。
  只给工具类别与筛选标准，不给具体标的推荐。
description_en: >-
  Builds a family Investment Policy Statement (IPS): buckets investable assets by purpose rather than
  by expected return, then produces target weights with bands, rebalancing triggers, and Monte-Carlo
  goal-attainment probability. Covers balance-sheet health check, risk profiling, time bucketing,
  strategic asset allocation, instrument mapping, rebalancing rules, and insurance gap analysis.
